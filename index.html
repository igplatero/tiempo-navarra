<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El tiempo en Navarra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--rosa:#CD9391;--granate:#831A2E;--vino:#3B0713;--carbon:#1D1F22;--azul:#365EA1;--pizarra:#2A3A55;--arena:#B09F99;--hueso:#F5EFED}
*{box-sizing:border-box;margin:0}
body{background:var(--carbon);color:var(--hueso);font:400 1rem/1.5 "Bricolage Grotesque",system-ui,sans-serif;padding:clamp(1rem,3vw,2rem)}
main{max-width:1100px;margin:auto;display:grid;gap:2rem}
h2{font-size:1.4rem;font-weight:600;margin-bottom:.75rem}
.heros{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem}
.hero{border-radius:28px;padding:1.5rem 1.75rem}
.h0{background:linear-gradient(155deg,var(--granate),var(--vino))}
.h1{background:var(--pizarra)}
.cab{color:var(--rosa)}.h1 .cab,.h1 dt{color:var(--arena)}
.gran{display:flex;align-items:center;gap:1rem}
.ic{font-size:clamp(3rem,9vw,4.5rem)}
.t{font-size:clamp(5rem,16vw,9rem);font-weight:800;line-height:1;letter-spacing:-.04em}
.cs{margin:.25rem 0 1.25rem;font-size:1.1rem}
dl{display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem 1rem}
dt{color:var(--rosa);font-size:.85rem}dd{font-weight:600}

/* Mapa meteorológico municipal de Navarra */
.mapa-sec{background:linear-gradient(165deg,#232934 0%,var(--carbon) 100%);border:1px solid rgba(245,239,237,.08);border-radius:28px;padding:clamp(1.15rem,2.5vw,1.75rem)}
.mapa-cab{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:.75rem;margin-bottom:1rem}
.mapa-cab h2{margin:0}
.mapa-sub{color:var(--arena);font-size:.9rem;margin-top:.15rem}
.tabs{display:inline-flex;background:var(--carbon);padding:.25rem;border-radius:14px;border:1px solid rgba(245,239,237,.1)}
.tab{background:transparent;border:0;color:var(--arena);font:600 .9rem/1 "Bricolage Grotesque",system-ui,sans-serif;padding:.55rem 1rem;border-radius:10px;cursor:pointer;transition:background .2s,color .2s}
.tab[aria-selected="true"]{background:var(--granate);color:var(--hueso)}
.tab:focus-visible{outline:2px solid var(--rosa);outline-offset:2px}
.mapa-grid{display:grid;grid-template-columns:1fr;gap:1.25rem;align-items:center}
@media(min-width:860px){.mapa-grid{grid-template-columns:1.25fr .85fr}}
.mapa-lienzo{width:100%;max-width:580px;margin:auto;position:relative}
.mapa-svg{width:100%;height:auto;display:block;overflow:visible}
.navarra-silueta{fill:var(--pizarra);stroke:rgba(205,147,145,.65);stroke-width:2.2;stroke-linejoin:round;filter:drop-shadow(0 12px 24px rgba(0,0,0,.35))}
.navarra-municipios{fill:none;stroke:rgba(245,239,237,.18);stroke-width:.65;stroke-linejoin:round;stroke-linecap:round;pointer-events:none}
.nodo{cursor:pointer;transition:transform .15s ease}
.nodo:hover .nodo-card,.nodo.activo .nodo-card{fill:var(--granate);stroke:var(--rosa);stroke-width:1.8}
.nodo:focus-visible{outline:none}
.nodo:focus-visible .nodo-card{stroke:var(--hueso);stroke-width:2}
.nodo-punto{fill:var(--rosa);stroke:var(--carbon);stroke-width:2}
.nodo.activo .nodo-punto{fill:var(--hueso);r:5.5}
.nodo-card{fill:rgba(29,31,34,.92);stroke:rgba(245,239,237,.18);stroke-width:1.2}
.nodo-nombre{fill:var(--hueso);font-size:11.5px;font-weight:600}
.nodo-tmax{fill:var(--hueso);font-size:13px;font-weight:800}
.nodo-tmin{fill:var(--rosa);font-size:11.5px;font-weight:600}
.nodo-ic{font-size:17px}

/* Panel lateral de detalle del municipio seleccionado */
.mapa-detalle{background:var(--vino);border-radius:22px;padding:1.25rem 1.4rem;display:grid;gap:.85rem}
.det-top{display:flex;justify-content:space-between;align-items:flex-start;gap:.75rem}
.det-loc{font-size:1.35rem;font-weight:800;line-height:1.15}
.det-dia{color:var(--rosa);font-size:.85rem;text-transform:capitalize}
.det-ic{font-size:2.6rem;line-height:1}
.det-temps{display:flex;align-items:baseline;gap:.75rem}
.det-max{font-size:2.6rem;font-weight:800;line-height:1}
.det-min{font-size:1.25rem;font-weight:600;color:var(--rosa)}
.det-txt{font-size:.98rem;color:var(--hueso)}
.det-meta{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem .75rem;padding-top:.65rem;border-top:1px solid rgba(245,239,237,.12);font-size:.85rem}
.det-meta span{color:var(--rosa);display:block;font-size:.78rem}
.det-nota{font-size:.78rem;color:var(--arena)}

.filas{container-type:inline-size;display:grid;gap:.5rem}
.fila{display:grid;grid-template-columns:5.5rem 1fr minmax(8rem,1.2fr);grid-template-areas:"d c r" "m m m";align-items:center;gap:.25rem 1rem;background:var(--pizarra);border-radius:16px;padding:.75rem 1rem}
@container (min-width:680px){.fila{grid-template-columns:7rem 12rem minmax(10rem,1fr) 2fr;grid-template-areas:"d c r m"}}
.dia{grid-area:d;text-transform:capitalize;font-weight:600}
.cielo{grid-area:c;display:flex;gap:.5rem;align-items:center;font-size:1.5rem}
.cielo small{font-size:.85rem;color:var(--arena);line-height:1.2}
.rango{grid-area:r;display:flex;align-items:center;gap:.5rem;font-weight:600}
.pista{flex:1;height:8px;border-radius:8px;background:var(--carbon);position:relative;overflow:hidden}
.barra{position:absolute;top:0;bottom:0;border-radius:8px;background:linear-gradient(90deg,var(--azul),var(--rosa));transform-origin:left;animation:crece .9s ease-out both}
@keyframes crece{from{transform:scaleX(0)}}
.meta{grid-area:m;display:flex;flex-wrap:wrap;gap:.25rem 1rem;font-size:.85rem;color:var(--arena)}
.pueblos{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem;align-items:start}
details{background:var(--vino);border-radius:20px;padding:1rem 1.25rem}
details .fila{background:var(--carbon)}
summary{display:flex;align-items:center;gap:.75rem;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary b{flex:1;font-size:1.15rem}
summary .tt{font-weight:800;font-size:1.6rem}summary .tn{color:var(--rosa)}
summary .ver{font-size:.8rem;color:var(--arena)}
details[open] summary{margin-bottom:.75rem}details[open] .ver{display:none}
summary:focus-visible{outline:2px solid var(--rosa);outline-offset:4px}
footer,.err{color:var(--arena);font-size:.85rem}
@media(prefers-reduced-motion:reduce){.barra{animation:none}}
</style>
</head>
<body>
<main id="app"><p class="err">Cargando previsión…</p></main>
<script>
const icon=c=>{const n=parseInt(c);return !n||n<=11?"☀️":n==12||n==17?"🌤️":n==13?"⛅":n==14?"🌥️":n<=16?"☁️":n<30?"🌧️":n<40?"🌨️":n<50?"🌦️":n<70?"⛈️":n<80?"🌨️":"🌫️"};
const etq=(f,i)=>i==0?"Hoy":i==1?"Mañana":new Date(f+"T12:00:00").toLocaleDateString("es",{weekday:"long",day:"numeric"});
const viento=d=>d.dir=="C"||!d.vel?"Viento en calma":`Viento ${d.dir} a ${d.vel} km/h`;

const COORDS={

,570.3 L 234.1,566.2 L 228.1,562.2 L 222.2,558.1 L 216.2,554.1 L 210.3,550.0 L 204.4,545.9 L 198.4,541.9 L 192.5,537.8 L 186.6,533.8 L 180.6,529.7 L 174.7,525.6 L 168.8,521.6 L 162.8,517.5 L 156.9,513.4 L 150.9,509.4 L 145.0,505.3 L 139.1,501.2 L 133.1,497.2 L 127.2,493.1 L 121.2,489.1 L 115.3,485.0 L 109.4,480.9 L 103.4,476.9 L 97.5,472.8 L 91.6,468.8 L 85.6,464.7 L 79.7,460.6 L 73.8,456.6 L 67.8,452.5 L 61.9,448.4 L 55.9,444.4 L 50.0,440.3 L 44.1,436.2 L 38.1,432.2 L 32.2,428.1 L 26.2,424.1 L 20.3,420.0 L 16.2,414.1 L 16.2,406.6 L 16.2,399.1 L 16.2,391.6 L 16.2,384.1 L 16.2,376.6 L 16.2,369.1 L 16.2,361.6 L 16.2,354.1 L 16.2,346.6 L 16.2,339.1 L 16.2,331.6 L 16.2,324.1 L 16.2,316.6 L 16.2,309.1 L 16.2,301.6 L 16.2,294.1 L 16.2,286.6 L 16.2,279.1 L 16.2,271.6 L 16.2,264.1 L 16.2,256.6 L 16.2,249.1 L 16.2,241.6 L 16.2,234.1 L 16.2,226.6 L 16.2,219.1 L 16.2,211.6 L 16.2,204.1 L 16.2,196.6 L 16.2,189.1 L 16.2,181.6 L 16.2,174.1 L 16.2,166.6 L 16.2,159.1 L 16.2,151.6 L 16.2,144.1 L 16.2,136.6 L 16.2,129.1 L 16.2,121.6 L 16.2,114.1 L 16.2,106.6 L 16.2,99.1 L 16.2,91.6 L 16.2,84.1 L 16.2,76.6 L 16.2,69.1 L 16.2,61.6 L 16.2,54.1 L 16.2,46.6 L 16.2,39.1 L 16.2,31.6 L 16.2,24.1 L 16.2,16.6 Z";
const EXCLAVES_NAVARRA="M 462.2,374.7 L 468.4,376.2 L 474.1,380.6 L 479.1,385.6 L 484.4,390.3 L 486.6,396.6 L 481.2,401.2 L 475.0,403.8 L 468.8,405.6 L 462.5,407.2 L 456.2,408.8 L 450.0,407.2 L 446.6,401.6 L 448.4,395.3 L 451.9,389.1 L 455.6,383.1 L 459.1,377.5 Z M 443.8,395.3 L 446.9,398.4 L 445.0,403.4 L 440.6,406.9 L 435.9,409.7 L 432.8,406.2 L 435.0,400.9 L 438.8,396.6 Z";
const LINEAS_MUNICIPIOS="M 289.1,14.7 L 285.0,22.5 L 281.2,30.6 L 278.4,38.8 L 276.2,46.9 L 274.7,55.3 L 273.8,63.8 L 273.4,72.2 L 273.4,80.6 L 273.8,89.1 L 274.4,97.5 L 275.3,105.9 L 276.6,114.4 L 278.1,122.8 L 280.0,131.2 L 282.2,139.4 L 284.7,147.5 L 287.5,155.6 L 290.6,163.8 L 294.1,171.6 L 297.8,179.4 L 301.9,187.2 L 306.2,194.7 L 310.9,202.2 L 315.9,209.4 L 321.2,216.6 L 326.9,223.4 L 332.8,230.0 L 339.1,236.2 L 345.6,242.2 L 352.5,247.8 L 359.7,253.1 L 367.2,258.1 L 375.0,262.8 L 383.1,267.2 L 391.6,271.2 L 400.3,275.0 L 409.4,278.4 L 418.8,281.6 L 428.4,284.4 L 438.4,286.9 L 448.8,289.1 L 459.4,290.9 L 470.3,292.5 L 481.6,293.8 L 493.1,294.7 L 505.0,295.3 L 517.2,295.6 L 529.7,295.6 L 542.5,295.3 L 555.6,294.7";

const hero=(d,i)=>`<article class="hero h${i}"><p class="cab"><b>${etq(d.fecha,i)}</b> en Pamplona</p><div class="gran"><span class="ic">${icon(d.cielo)}</span><span class="t">${d.tmax}°</span></div><p class="cs">${d.txt}, mínima de ${d.tmin}°</p><dl><div><dt>Sensación térmica</dt><dd>${d.smin}° a ${d.smax}°</dd></div><div><dt>Viento</dt><dd>${viento(d).replace("Viento ","")}</dd></div><div><dt>Probabilidad de lluvia</dt><dd>${d.lluvia}%</dd></div><div><dt>Índice UV máximo</dt><dd>${d.uv??"–"}</dd></div></dl></article>`;

function filas(dias){
  const lo=Math.min(...dias.map(d=>d.tmin)),hi=Math.max(...dias.map(d=>d.tmax)),sp=(hi-lo)||1;
  return `<div class="filas">`+dias.map((d,i)=>`<div class="fila"><span class="dia">${etq(d.fecha,i)}</span><span class="cielo">${icon(d.cielo)}<small>${d.txt}</small></span><span class="rango">${d.tmin}°<span class="pista"><span class="barra" style="left:${(d.tmin-lo)/sp*100}%;width:${Math.max((d.tmax-d.tmin)/sp*100,6)}%"></span></span>${d.tmax}°</span><span class="meta"><span>Sensación ${d.smin}° a ${d.smax}°</span><span>${viento(d)}</span><span>Lluvia ${d.lluvia}%</span></span></div>`).join("")+`</div>`;
}

const pueblo=(n,l)=>{const d=l.dias[0];return `<details><summary><span>${icon(d.cielo)}</span><b>${n}</b><span class="tn">${d.tmin}°</span><span class="tt">${d.tmax}°</span><span class="ver">Ver semana</span></summary>${filas(l.dias)}</details>`};

function renderMapa(L,diaIdx,selLoc){
  const nodos=Object.entries(COORDS).filter(([n])=>L[n]&&L[n].dias[diaIdx]).map(([n,c])=>{
    const d=L[n].dias[diaIdx],activo=n===selLoc?" activo":"";
    const lx=c.dx<0?c.x+c.dx+c.w:c.x+c.dx;
    return `<g class="nodo${activo}" data-loc="${n}" tabindex="0" role="button" aria-label="${n}: ${d.txt}, máxima ${d.tmax}°, mínima ${d.tmin}°">
      <line x1="${c.x}" y1="${c.y}" x2="${lx}" y2="${c.y+22}" stroke="rgba(205,147,145,.55)" stroke-width="1.2"/>
      <circle class="nodo-punto" cx="${c.x}" cy="${c.y}" r="4.2"/>
      <g transform="translate(${c.x+c.dx},${c.y+c.dy})">
        <rect class="nodo-card" x="0" y="0" width="${c.w}" height="44" rx="10"/>
        <text class="nodo-nombre" x="8" y="15">${n}</text>
        <text class="nodo-ic" x="7" y="36">${icon(d.cielo)}</text>
        <text class="nodo-tmax" x="31" y="35">${d.tmax}°</text>
        <text class="nodo-tmin" x="58" y="35">${d.tmin}°</text>
      </g>
    </g>`;
  }).join("");

  const locData=L[selLoc]?.dias[diaIdx]||L.Pamplona.dias[diaIdx];
  const locName=L[selLoc]?selLoc:"Pamplona";

  return `<div class="mapa-cab">
    <div>
      <h2>Mapa del tiempo en Navarra</h2>
      <p class="mapa-sub">Estado del cielo y temperaturas (máx. / mín.) por localidad. Pulsa un municipio para ver el detalle.</p>
    </div>
    <div class="tabs" role="tablist" aria-label="Seleccionar día de previsión">
      <button class="tab" role="tab" data-dia="0" aria-selected="${diaIdx===0}">Hoy</button>
      <button class="tab" role="tab" data-dia="1" aria-selected="${diaIdx===1}">Mañana</button>
      <button class="tab" role="tab" data-dia="2" aria-selected="${diaIdx===2}">Pasado</button>
    </div>
  </div>
  <div class="mapa-grid">
    <div class="mapa-lienzo">
      <svg class="mapa-svg" viewBox="0 0 600 643.1" role="img" aria-label="Mapa municipal meteorológico de la Comunidad Foral de Navarra">
        <path class="navarra-silueta" d="${CONTORNO_NAVARRA}"/>
        <path class="navarra-silueta" d="${EXCLAVES_NAVARRA}"/>
        <path class="navarra-municipios" d="${LINEAS_MUNICIPIOS}"/>
        ${nodos}
      </svg>
    </div>
    <aside class="mapa-detalle" aria-live="polite">
      <div class="det-top">
        <div>
          <p class="det-dia">${etq(locData.fecha,diaIdx)}</p>
          <h3 class="det-loc">${locName}</h3>
        </div>
        <span class="det-ic">${icon(locData.cielo)}</span>
      </div>
      <div class="det-temps">
        <span class="det-max">${locData.tmax}°</span>
        <span class="det-min">mín. ${locData.tmin}°</span>
      </div>
      <p class="det-txt">${locData.txt}</p>
      <div class="det-meta">
        <div><span>Sensación térmica</span><strong>${locData.smin}° a ${locData.smax}°</strong></div>
        <div><span>Lluvia</span><strong>${locData.lluvia}%</strong></div>
        <div><span>Viento</span><strong>${viento(locData).replace("Viento ","")}</strong></div>
        <div><span>Índice UV máx.</span><strong>${locData.uv??"–"}</strong></div>
      </div>
      <p class="det-nota">Mapa municipal de Navarra. Datos oficiales AEMET.</p>
    </aside>
  </div>`;
}

const altura=()=>parent.postMessage({tiempoAltura:document.documentElement.scrollHeight},"*");

fetch("data/tiempo.json",{cache:"no-cache"}).then(r=>r.json()).then(j=>{
  const L=j.lugares,p=L.Pamplona.dias,otros=Object.entries(L).filter(([n])=>n!="Pamplona");
  const act=new Date(j.actualizado).toLocaleString("es",{dateStyle:"long",timeStyle:"short"});
  let diaMapa=0,locMapa="Pamplona";

  app.innerHTML=`<section><div class="heros">${hero(p[0],0)}${p[1]?hero(p[1],1):""}</div></section>
  <section class="mapa-sec" id="mapa-contenedor">${renderMapa(L,diaMapa,locMapa)}</section>
  <section><h2>La semana en Pamplona</h2>${filas(p)}</section>
  <section><h2>El tiempo en el resto de Navarra</h2><div class="pueblos">${otros.map(([n,l])=>pueblo(n,l)).join("")}</div></section>
  <footer>Fuente: AEMET (Agencia Estatal de Meteorología). Actualizado el ${act}.</footer>`;

  const cont=document.getElementById("mapa-contenedor");
  const refrescar=()=>{cont.innerHTML=renderMapa(L,diaMapa,locMapa);altura();};
  cont.addEventListener("click",e=>{
    const tab=e.target.closest(".tab");
    if(tab){diaMapa=Number(tab.dataset.dia);refrescar();return;}
    const nodo=e.target.closest(".nodo");
    if(nodo){locMapa=nodo.dataset.loc;refrescar();}
  });
  cont.addEventListener("keydown",e=>{
    if(e.key==="Enter"||e.key===" "){
      const nodo=e.target.closest(".nodo");
      if(nodo){e.preventDefault();locMapa=nodo.dataset.loc;refrescar();}
    }
  });

  altura();document.addEventListener("toggle",altura,true);addEventListener("resize",altura);
}).catch(()=>{app.innerHTML=`<p class="err">No se ha podido cargar la previsión. Inténtalo de nuevo en unos minutos.</p>`});
</script>
</body>
</html>
