name: Actualizar tiempo
on:
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  datos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/fetch_aemet.py
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
      - run: |
          git config user.name "tiempo-bot"
          git config user.email "tiempo-bot@users.noreply.github.com"
          git add data/tiempo.json
          git diff --staged --quiet || (git commit -m "Actualiza datos AEMET" && git push)
